<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="200" y="40" font-family="sans-serif" font-weight="bold" font-size="16" fill="#f8fafc" text-anchor="middle">Press Militar con Mancuernas</text>
  <text x="200" y="65" font-family="sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Empuje vertical sobre cabeza - Core activo</text>
  <!-- Banco inclinado a 75° -->
  <line x1="170" y1="260" x2="190" y2="150" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <!-- Suelo -->
  <line x1="50" y1="265" x2="350" y2="265" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="140" r="15" fill="#94a3b8"/>
  <line x1="200" y1="155" x2="195" y2="220" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
  <!-- Piernas sentadas -->
  <path d="M195 220 L240 225 L245 260" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brazos empujando mancuernas -->
  <path d="M190 165 L160 120 L160 95" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <path d="M210 165 L240 120 L240 95" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <!-- Mancuernas -->
  <rect x="145" y="85" width="30" height="12" rx="4" fill="#06b6d4"/>
  <rect x="225" y="85" width="30" height="12" rx="4" fill="#06b6d4"/>
</svg>
