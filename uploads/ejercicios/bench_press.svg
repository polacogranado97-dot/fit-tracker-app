<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="barG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgG)" stroke="#1e293b" stroke-width="2"/>
  <!-- Banco plano -->
  <rect x="70" y="190" width="260" height="20" rx="6" fill="#334155" />
  <rect x="110" y="210" width="16" height="50" rx="3" fill="#1e293b" />
  <rect x="274" y="210" width="16" height="50" rx="3" fill="#1e293b" />
  <!-- Atleta esquemático -->
  <rect x="110" y="175" width="160" height="16" rx="8" fill="#94a3b8" />
  <circle cx="95" cy="180" r="14" fill="#94a3b8" />
  <!-- Piernas al suelo -->
  <path d="M260 185 L280 230 L300 260" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Brazos sosteniendo barra -->
  <path d="M165 178 L180 120 L210 120 L225 178" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <!-- Barra de pesas -->
  <rect x="80" y="112" width="240" height="8" rx="4" fill="url(#barG)" />
  <!-- Discos -->
  <rect x="85" y="85" width="14" height="62" rx="4" fill="#10b981" />
  <rect x="301" y="85" width="14" height="62" rx="4" fill="#10b981" />
  <!-- Título y detalles -->
  <text x="200" y="40" font-family="sans-serif" font-weight="bold" font-size="16" fill="#f8fafc" text-anchor="middle">Press de Banca Plano</text>
  <text x="200" y="65" font-family="sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Técnica: Pausa en pecho y retracción escapular</text>
  <!-- Flechas de movimiento -->
  <path d="M200 135 L200 160" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>
